---
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - TZ=Asia/Jakarta
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881

      - PUID=1001
      - PGID=100
    volumes:
      - /srv/dev-disk-by-uuid-87d634ab-40dc-437c-b70f-6785297a78d8/docker/appdata/qbittorrent/config:/config
      - /srv/dev-disk-by-uuid-87d634ab-40dc-437c-b70f-6785297a78d8/SMB/:/downloads #optional
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped